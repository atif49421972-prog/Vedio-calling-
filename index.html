<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Real WebRTC Video Call</title>
<style>
  body { font-family: Arial; text-align: center; background: #1a1a1a; color: white; }
 .video-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
  video { width: 45%; max-width: 400px; background: #000; border-radius: 8px; transform: scaleX(-1); }
  input, button { padding: 10px; font-size: 16px; border-radius: 5px; border: none; margin: 5px; }
  button { background: #007bff; color: white; cursor: pointer; }
  button:disabled { background: #555; }
</style>
</head>
<body>

<h2>Real Video Call</h2>

<input id="roomInput" placeholder="Room ID likho" />
<button id="createBtn">Create Room</button>
<button id="joinBtn">Join Room</button>

<div class="video-container">
  <div>
    <h3>You</h3>
    <video id="localVideo" autoplay muted playsinline></video>
  </div>
  <div>
    <h3>Friend</h3>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>
</div>

<script type="module">
// Firebase config - YAHAN APNA CONFIG DALNA
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
import { getDatabase, ref, set, onValue, push, remove } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT.firebaseio.com",
  projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:1902' }] };
let localStream, pc, roomId, roomRef;

const localVideo = document.getElementById('localVideo');
const remoteVideo = document.getElementById('remoteVideo');

document.getElementById('createBtn').onclick = createRoom;
document.getElementById('joinBtn').onclick = joinRoom;

async function startCamera() {
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  localVideo.srcObject = localStream;
}

async function createRoom() {
  await startCamera();
  roomId = Math.random().toString(36).substr(2, 6);
  roomRef = ref(db, 'rooms/' + roomId);
  alert('Room ID: ' + roomId + ' - Ye friend ko bhejo');

  pc = new RTCPeerConnection(rtcConfig);
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await set(ref(db, 'rooms/' + roomId + '/offer'), offer);

  pc.onicecandidate = e => {
    if (e.candidate) push(ref(db, 'rooms/' + roomId + '/callerCandidates'), e.candidate.toJSON());
  };

  pc.ontrack = e => remoteVideo.srcObject = e.streams[0];

  onValue(ref(db, 'rooms/' + roomId + '/answer'), async snap => {
    if (snap.exists()) await pc.setRemoteDescription(snap.val());
  });

  onValue(ref(db, 'rooms/' + roomId + '/calleeCandidates'), snap => {
    snap.forEach(child => pc.addIceCandidate(child.val()));
  });
}

async function joinRoom() {
  await startCamera();
  roomId = document.getElementById('roomInput').value;
  roomRef = ref(db, 'rooms/' + roomId);

  pc = new RTCPeerConnection(rtcConfig);
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  onValue(ref(db, 'rooms/' + roomId + '/offer'), async snap => {
    if (snap.exists()) {
      await pc.setRemoteDescription(snap.val());
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await set(ref(db, 'rooms/' + roomId + '/answer'), answer);
    }
  });

  pc.onicecandidate = e => {
    if (e.candidate) push(ref(db, 'rooms/' + roomId + '/calleeCandidates'), e.candidate.toJSON());
  };

  pc.ontrack = e => remoteVideo.srcObject = e.streams[0];

  onValue(ref(db, 'rooms/' + roomId + '/callerCandidates'), snap => {
    snap.forEach(child => pc.addIceCandidate(child.val()));
  });
}
</script>
</body>
</html>
